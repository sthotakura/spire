<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" width="620" height="270" role="img" aria-label="Timeline of a note that can redeem early: if the stated condition is met on an observation date the note ends and pays then; otherwise it continues to scheduled maturity" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#17243a">
  <rect width="620" height="270" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2369bd"/></marker>
  </defs>
  <!-- the product's life -->
  <line x1="60" y1="170" x2="560" y2="170" stroke="#42536d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="60" cy="170" r="8" fill="#ffffff" stroke="#2369bd" stroke-width="3.5"/>
  <text x="60" y="204" font-weight="600">Start</text>
  <!-- stated observation dates -->
  <g fill="#ffffff" stroke="#9775fa" stroke-width="3.5">
    <circle cx="190" cy="170" r="8"/><circle cx="320" cy="170" r="8"/><circle cx="450" cy="170" r="8"/>
  </g>
  <text x="190" y="204" text-anchor="middle" font-weight="600">Date 1</text>
  <text x="320" y="204" text-anchor="middle" font-weight="600">Date 2</text>
  <text x="450" y="204" text-anchor="middle" font-weight="600">Date 3</text>
  <text x="320" y="222" text-anchor="middle" fill="#42536d">Condition tested on each stated date</text>
  <!-- scheduled maturity -->
  <circle cx="560" cy="170" r="9" fill="#2369bd"/>
  <text x="560" y="204" text-anchor="end" font-weight="600">Maturity</text>
  <text x="560" y="134" text-anchor="end" fill="#42536d">Not met on any date:</text>
  <text x="560" y="150" text-anchor="end" fill="#42536d">paid at scheduled maturity</text>
  <!-- early redemption -->
  <line x1="320" y1="156" x2="320" y2="76" stroke="#2369bd" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="30" width="180" height="42" rx="8" fill="#edf5ff" stroke="#2369bd" stroke-width="1.5"/>
  <text x="320" y="49" text-anchor="middle" font-weight="600">Condition met on Date 2</text>
  <text x="320" y="65" text-anchor="middle" fill="#42536d">Ends early and pays then</text>
  <text x="60" y="256" fill="#66758b">An illustration of the concept. SPIRe calculates scheduled maturity payments only.</text>
</svg>
