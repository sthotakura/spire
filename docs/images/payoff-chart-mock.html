<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payoff Chart Mock</title>
<style>
  :root { --ink: #17243a; --muted: #66758b; --faint: #8794a8; --hairline: #dce4ee; }
  body { margin: 0; background: #f4f7fb; font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: var(--ink); }
  .panel { width: 660px; margin: 24px auto; background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 22px 25px; }
  h2 { font-size: 21px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  svg { width: 100%; height: auto; display: block; }
  .axis { stroke: #aab7c9; stroke-width: 1; }
  .grid { stroke: #eef2f7; stroke-width: 1; }
  .tick { fill: #5a6a82; font-size: 11px; }
  .tick.zero { font-weight: 700; fill: var(--ink); }
  .title { fill: #74839a; font-size: 11.5px; }
  .underlier { fill: none; stroke: #8794a8; stroke-width: 1.75; stroke-dasharray: 7 5; }
  .casing { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .piece { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .drop { stroke: #8494ab; stroke-width: 1; stroke-dasharray: 2 3; }
  .label { fill: var(--ink); font-size: 11.5px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
  .label.soft { fill: #42536d; font-weight: 500; }
  .leader { stroke: #42536d; stroke-width: 1; fill: none; }
  .key { display: flex; gap: 18px; font-size: 12.5px; color: #42536d; margin: 4px 0 0 52px; }
  .key svg { width: 26px; display: inline; vertical-align: middle; margin-right: 6px; }
</style>
</head>
<body>
<div class="panel">
  <h2>Payoff at redemption</h2>
  <p class="sub">What it pays for each change in the underlier, against moving 1:1 with it</p>
  <svg id="chart" viewBox="0 0 620 380" role="img" aria-label="Mock payoff chart"></svg>
  <div class="key">
    <span><svg viewBox="0 0 26 8"><line x1="1" y1="4" x2="25" y2="4" stroke="#42536d" stroke-width="4" stroke-linecap="round"/></svg>The note</span>
    <span><svg viewBox="0 0 26 8"><line x1="1" y1="4" x2="25" y2="4" stroke="#8794a8" stroke-width="1.75" stroke-dasharray="7 5"/></svg>Moving 1:1 with Synthetic Index</span>
  </div>
</div>
<script>
const P = 1000, buffer = 0.15, cap = 0.5, finalReturn = 0.3
const plot = { left: 62, right: 596, top: 22, bottom: 330 }
const axisTop = 1600
const X = (r) => plot.left + (r + 1) / 2 * (plot.right - plot.left)
const Y = (a) => plot.bottom - a / axisTop * (plot.bottom - plot.top)
const pay = (r) => r >= 0 ? P * (1 + Math.min(r, cap)) : r >= -buffer ? P * (1 - r) : P * (1 + r + buffer)
const colors = { downside: '#d9480f', absolute: '#d4a017', upside: '#2b8a3e', cap: '#a23b8c' }
const pieces = [
  ['downside', -1, -buffer - 1e-9], ['absolute', -buffer, 0], ['upside', 0, cap], ['cap', cap, 1],
]
const svg = document.getElementById('chart')
const el = (name, attrs, text) => { const e = document.createElementNS('http://www.w3.org/2000/svg', name); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; svg.appendChild(e); return e }
const pts = (a, b, n = 40) => Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n).map((r) => `${X(r)},${Y(pay(r))}`).join(' ')

// Grid, ticks and axes. Zero stays at the bottom.
for (let a = 0; a <= axisTop; a += 200) { el('line', { x1: plot.left, x2: plot.right, y1: Y(a), y2: Y(a), class: 'grid' }); el('text', { x: plot.left - 8, y: Y(a) + 4, 'text-anchor': 'end', class: 'tick' }, a.toLocaleString('en-US')) }
for (let r = -1; r <= 1.0001; r += 0.2) { const v = Math.round(r * 100); el('text', { x: X(r), y: plot.bottom + 17, 'text-anchor': 'middle', class: 'tick' + (v === 0 ? ' zero' : '') }, `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}%`) }
el('line', { x1: plot.left, x2: plot.right, y1: plot.bottom, y2: plot.bottom, class: 'axis' })
el('line', { x1: plot.left, x2: plot.left, y1: plot.top, y2: plot.bottom, class: 'axis' })
el('text', { x: (plot.left + plot.right) / 2, y: plot.bottom + 38, 'text-anchor': 'middle', class: 'title' }, 'Change in Synthetic Index from its initial level')
el('text', { x: plot.left, y: plot.top - 8, class: 'title' }, 'Payment')

// Tinted gaps between the note and the underlier line, in the colour of the piece that makes the gap.
const gap = (key, a, b) => {
  const n = 30, rs = Array.from({ length: n + 1 }, (_, i) => a + (b - a) * i / n)
  const note = rs.map((r) => `${X(r)},${Y(pay(r))}`), under = rs.slice().reverse().map((r) => `${X(r)},${Y(Math.min(axisTop, Math.max(0, P * (1 + r))))}`)
  el('polygon', { points: [...note, ...under].join(' '), fill: colors[key], 'fill-opacity': 0.13 })
}
gap('absolute', -buffer, 0)


// Droplines at the points where the rule changes.
for (const r of [-buffer, 0, cap]) el('line', { x1: X(r), x2: X(r), y1: Y(pay(r)), y2: plot.bottom, class: 'drop' })

// The underlier, moving 1:1, clipped at the top of the axis.
el('polyline', { points: `${X(-1)},${Y(0)} ${X(0.6)},${Y(axisTop)}`, class: 'underlier' })

// The note, one piece per rule, broken at the jump.
for (const [key, a, b] of pieces) el('polyline', { points: pts(a, b), class: 'casing' })
for (const [key, a, b] of pieces) el('polyline', { points: pts(a, b), class: 'piece', stroke: colors[key] })
el('circle', { cx: X(-buffer), cy: Y(P), r: 5, fill: '#fff', stroke: colors.downside, 'stroke-width': 2.5 })
el('circle', { cx: X(-buffer), cy: Y(pay(-buffer)), r: 5, fill: colors.absolute, stroke: '#fff', 'stroke-width': 2 })

// Labels on the features, with leaders. Text stays in ink; the line beside it carries the colour.
const label = (x, y, lines, anchor = 'start', cls = 'label') => lines.forEach((t, i) => el('text', { x, y: y + i * 14, 'text-anchor': anchor, class: cls }, t))
const leader = (x1, y1, x2, y2) => el('path', { d: `M${x1},${y1} L${x2},${y2}`, class: 'leader' })
label(X(0.07), Y(840), ['Principal 1,000'], 'start'); leader(X(0.08), Y(870), X(0) + 2, Y(990))
label(X(-0.47), Y(1420), ['A fall of up to 15%', 'is paid as a gain'], 'middle'); leader(X(-0.32), Y(1335), X(-0.09), Y(1095))
label(X(-0.6), Y(820), ['A larger fall loses', 'only what is past 15%'], 'middle'); leader(X(-0.6), Y(735), X(-0.55), Y(pay(-0.55)) - 6)
label(X(0.78), Y(1560), ['Capped at 1,500'], 'middle')
label(X(-0.72), Y(60), ['Minimum 150'], 'start'); leader(X(-0.73), Y(80), X(-0.985), Y(150))
label(X(0.4), Y(640), ['Pays what the', 'index does'], 'middle', 'label soft'); leader(X(0.4), Y(720), X(0.22), Y(1205))

// The hypothetical final level, as now: an ink dot with its value bubble.
const fx = X(finalReturn), fy = Y(pay(finalReturn))
el('circle', { cx: fx, cy: fy, r: 6, fill: '#17243a', stroke: '#fff', 'stroke-width': 3 })
const text = '+30% (130) → 1,300', w = text.length * 6.6 + 16
el('rect', { x: fx - w / 2, y: fy - 36, width: w, height: 22, rx: 6, fill: '#17243a' })
el('text', { x: fx, y: fy - 21, 'text-anchor': 'middle', fill: '#fff', 'font-size': 11.5, 'font-weight': 700 }, text)
</script>
</body>
</html>
